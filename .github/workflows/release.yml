# Packages the addon and uploads it to CurseForge (and a GitHub release) whenever a tag is pushed.
# Tags containing "alpha" or "beta" (e.g. 1.1.0-beta1) are uploaded as alpha/beta files.
name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: BigWigsMods/packager@v2
